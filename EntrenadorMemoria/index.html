<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrenador de Memoria</title>
  <meta name="description" content="Entrenamiento de memoria basado en métodos con evidencia científica y evaluación objetiva del progreso.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header class="barra">
    <button class="logo" data-ir="inicio" aria-label="Ir al inicio">🧠 <span>Entrenador de Memoria</span></button>
    <nav>
      <button data-ir="inicio">Inicio</button>
      <button data-ir="evaluacion">Evaluación</button>
      <button data-ir="progreso">Progreso</button>
      <button data-ir="evidencia">Evidencia</button>
      <button id="btnSonido" class="icono" title="Activar/desactivar sonido" aria-label="Sonido">🔊</button>
      <button id="btnTema" class="icono" title="Cambiar tema claro/oscuro" aria-label="Tema">🌓</button>
    </nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <div id="confeti" aria-hidden="true"></div>

  <script src="app.js"></script>
  <script src="evaluacion.js"></script>
  <script src="metodos.js"></script>
</body>
</html>
